<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- LuminAI Eyes SVG: Heterochromia (violet/cyan) with vertical elliptical pupils and Inkscape metadata -->
<svg
   width="64"
   height="32"
   version="1.1"
   id="luminai-eyes"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defsLum" />
  <sodipodi:namedview
     id="namedviewLum"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="16"
     inkscape:cx="32"
     inkscape:cy="16"
     inkscape:current-layer="RightEye" />
  <g inkscape:groupmode="layer" inkscape:label="LeftEye" id="LeftEye">
    <ellipse id="left-iris" cx="16" cy="16" rx="12" ry="8" fill="#6A00F4" stroke="#FFD700" stroke-width="2" />
    <ellipse id="left-pupil" cx="16" cy="16" rx="3" ry="6" fill="#FFD700" />
  </g>
  <g inkscape:groupmode="layer" inkscape:label="RightEye" id="RightEye">
    <ellipse id="right-iris" cx="48" cy="16" rx="12" ry="8" fill="#00D5C4" stroke="#FFD700" stroke-width="2" />
    <ellipse id="right-pupil" cx="48" cy="16" rx="3" ry="6" fill="#FFD700" />
  </g>
</svg>
