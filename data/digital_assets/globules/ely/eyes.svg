<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Ely Eyes SVG: Heterochromia (left silver, right cobalt) with vertical elliptical pupils and full Inkscape metadata -->
<svg
   width="64"
   height="32"
   version="1.1"
   id="ely-eyes"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defsEly" />
  <sodipodi:namedview
     id="namedviewEly"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="16"
     inkscape:cx="32"
     inkscape:cy="16"
     inkscape:current-layer="RightEye" />
  <g inkscape:groupmode="layer" inkscape:label="LeftEye" id="LeftEye">
    <ellipse id="left-iris" cx="16" cy="16" rx="12" ry="8" fill="#C0C0C0" stroke="#1A2636" stroke-width="2" />
    <ellipse id="left-pupil" cx="16" cy="16" rx="3" ry="6" fill="#1A2636" />
  </g>
  <g inkscape:groupmode="layer" inkscape:label="RightEye" id="RightEye">
    <ellipse id="right-iris" cx="48" cy="16" rx="12" ry="8" fill="#6AA0F4" stroke="#1A2636" stroke-width="2" />
    <ellipse id="right-pupil" cx="48" cy="16" rx="3" ry="6" fill="#1A2636" />
  </g>
</svg>
