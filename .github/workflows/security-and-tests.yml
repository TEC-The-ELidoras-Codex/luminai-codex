name: Security & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Display Bandit Results
        run: bandit -r src/ -f txt

  npm-audit:
    name: npm Audit (JavaScript Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (website)
        working-directory: ./website
        run: |
          npm ci
          npm audit --audit-level=moderate
        continue-on-error: true

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/backend

  frontend-tests:
    name: Frontend Tests (website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Run lint
        working-directory: ./website
        run: npm run lint

      - name: Run tests
        working-directory: ./website
        run: npm test
