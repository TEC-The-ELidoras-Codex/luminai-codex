name: Secret Scanning

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
    workflow_dispatch:

jobs:
    secret-scan:
        name: Scan for secrets and credentials
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Full history for better detection

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install detect-secrets
              run: |
                  pip install detect-secrets

            - name: Run detect-secrets
              run: |
                  detect-secrets scan --all-files --force-use-all-plugins \
                    --exclude-files '\.env\.example$' \
                    --exclude-files 'package-lock\.json$' \
                    --exclude-files 'docs/.*' \
                    --exclude-files 'tests/.*\.json$'

            - name: Check for sensitive patterns
              run: |
                  echo "Scanning for common secret patterns..."
                  ! grep -r -E 'sk-proj-[a-zA-Z0-9]{32,}' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude='*.md' . || {
                    echo "ERROR: Found potential OpenAI API key"
                    exit 1
                  }
                  ! grep -r -E 'sk-ant-api03-[a-zA-Z0-9_-]{95,}' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude='*.md' . || {
                    echo "ERROR: Found potential Anthropic API key"
                    exit 1
                  }
                  ! grep -r -E 'github_pat_[a-zA-Z0-9]{82}' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude='*.md' . || {
                    echo "ERROR: Found potential GitHub PAT"
                    exit 1
                  }
                  ! grep -r -E 'xai-[a-zA-Z0-9]{64,}' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude='*.md' . || {
                    echo "ERROR: Found potential xAI API key"
                    exit 1
                  }
                  echo "No secrets detected in code files"

            - name: Report results
              if: always()
              run: |
                  echo "Secret scan completed"
                  echo "Review any failures above for exposed credentials"
