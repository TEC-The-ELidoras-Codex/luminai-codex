# Pre-commit hooks for LuminAI Codex
# See https://pre-commit.com for more information

repos:
  # Secret detection with multiple tools for defense in depth
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.env\.example|
            docs/.*|
            tests/.*\.json|
            package-lock\.json
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: ["--verbose", "--no-git"]

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: |
          (?x)^(
            \.env\.example|
            docs/deployment/.*|
            docs/security/.*
          )$

  # Python code quality
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--extend-ignore=E203,W503"]

  # Local hooks
  - repo: local
    hooks:
      - id: block-env-files
        name: Block committing .env files
        entry: bash -c 'echo "[SECURITY] .env file commit blocked"; exit 1'
        language: system
        files: ^\.env(|\..*)$
        exclude: ^\.env\.example$

      - id: validate-memo-metadata
        name: Validate TEC Memo metadata in docs
        entry: python scripts/maintenance/validate_memo.py
        language: system
        files: ^docs/.*\.md$
        exclude: ^docs/(archive|reports)/
